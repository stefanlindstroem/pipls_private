site_name: Pi-PLS
site_description: Pi-PLS multivariate regression for Python
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Compatibility: compatibility.md
      - Examples: examples.md
      - Estimator API: estimator_api.md
  - Using Pi-PLS:
      - Parameter selection: parameter_selection.md
      - Choosing components: path_analysis.md
      - Cross-validation: cross_validation.md
      - Preprocessing: preprocessing.md
  - Model inspection: model_inspection.md
  - API reference:
      - Overview: api/index.md
      - Fixed regression: api/regression.md
      - Path selection: api/path.md
      - Decomposition: api/decomposition.md
      - Validation report: api/validation.md
      - Warnings: api/exceptions.md
      - Inspection: api/inspection.md
      - Plotting: api/plotting.md
      - Datasets and synthetic data: api/datasets.md
      - Metrics: api/metrics.md
  - Data and validation:
      - Datasets: datasets.md
      - Benchmarks: benchmarks.md
      - Reproducibility: reproducibility.md
  - Scientific background:
      - Theory: theory.md

exclude_docs: |
  decisions/**

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_object_full_path: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
