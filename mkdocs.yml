site_name: Pi-PLS
site_description: Pi-PLS multivariate regression for Python
copyright: Copyright © 2026 Vishal Agrawal, Fritjof Nilsson, and Stefan B. Lindström
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Tutorials:
      - 1. First model with synthetic data: tutorials/synthetic.md
      - 2. Complete Pulp analysis: tutorials/pulp.md
  - Examples: examples.md
  - Reference:
      - API overview: api/index.md
      - Fixed regression: api/regression.md
      - Path selection: api/path.md
      - Path-selection details: path_analysis.md
      - Troubleshooting: troubleshooting.md
      - Model inspection:
          - Concepts: model_inspection.md
          - API: api/inspection.md
      - Dataset API and generators: api/datasets.md
  - Project validation:
      - Reference datasets: datasets.md
      - Benchmarks: benchmarks.md
      - Reproducibility: reproducibility.md
      - Compatibility: compatibility.md
  - Scientific background:
      - Theory: theory.md
      - Companion manuscript synthetic data: manuscript_reproduction.md
      - Authors, license, and citation: citation.md

exclude_docs: |
  decisions/**

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_object_full_path: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
