schema_version: 1
dataset:
  id: linnerud
  title: Linnerud physical-exercise dataset
  version: "1"
  summary: >-
    Multi-output regression data containing three exercise predictors and three
    physiological responses for 20 middle-aged men in a fitness club.
files:
  predictors: X.csv
  responses: Y.csv
format:
  type: csv
  delimiter: ","
  encoding: utf-8
  header: true
dimensions:
  n_samples: 20
  n_predictors: 3
  n_responses: 3
predictors:
  - name: Chins
    description: Number of chin-up repetitions recorded for the participant.
  - name: Situps
    description: Number of sit-up repetitions recorded for the participant.
  - name: Jumps
    description: Number of jumping repetitions recorded for the participant.
responses:
  - name: Weight
    description: Body-weight measurement distributed with the source dataset.
  - name: Waist
    description: Waist measurement distributed with the source dataset.
  - name: Pulse
    description: Pulse measurement distributed with the source dataset.
sample_alignment:
  method: positional
  description: >-
    Row i in X.csv and row i in Y.csv refer to the same participant. No sample
    identifiers are available in the source data, so row order must be preserved.
missing_values:
  predictors: none
  responses: none
source:
  provider: scikit-learn
  provider_version: "1.8.0"
  upstream_predictors: sklearn/datasets/data/linnerud_exercise.csv
  upstream_responses: sklearn/datasets/data/linnerud_physiological.csv
  citation: >-
    Tenenhaus, M. (1998). La regression PLS: theorie et pratique.
    Paris: Editions Technip.
license:
  identifier: BSD-3-Clause
  file: LICENSE.txt
  redistribution: permitted
preparation:
  description: >-
    The upstream whitespace-delimited tables were converted to UTF-8,
    comma-delimited CSV with headers. Values, column order, and row order were
    preserved exactly. The files were renamed to the repository-wide X.csv and
    Y.csv convention.
integrity:
  sha256:
    X.csv: b40a7d43a02d401e764a44aa11be7ee28bc907960f73cf267014e95b27ddcc1f
    Y.csv: 8f8120e958a60b5f09466b575570f6eb36c7c35da58cca575ad14c0d0e9eeb86
    LICENSE.txt: 97a461834f569c24a4d78a74d37e35fe051f9a564dd43d066fd920a82706f441
