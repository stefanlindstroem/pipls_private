schema_version: 1
dataset:
  id: pulp
  title: Thermomechanical pulp fiber-property regression dataset
  version: "1"
  summary: >-
    Forty-six thermomechanical-pulp samples with 14 fiber-description predictors and eight
    responses comprising Canadian Standard Freeness and handsheet properties.
files:
  predictors: X.csv
  responses: Y.csv
format:
  type: csv
  delimiter: ","
  encoding: utf-8
  header: true
dimensions:
  n_samples: 46
  n_predictors: 14
  n_responses: 8
predictors:
  - name: Shives
    description: Shives-category measurement from the Pulp Expert analyzer; source units retained.
  - name: Fines B
    description: High-aspect-ratio Fines B particle measurement; source units retained.
  - name: L (arith)
    description: Arithmetic mean of the measured particle contour length L.
  - name: L (lw)
    description: Length-weighted mean of the measured particle contour length L.
  - name: L (llw)
    description: Length-length-weighted mean of the measured particle contour length L.
  - name: W (arith)
    description: Arithmetic mean of the measured particle width W.
  - name: W (lw)
    description: Length-weighted mean of the measured particle width W.
  - name: W (llw)
    description: Length-length-weighted mean of the measured particle width W.
  - name: C (arith)
    description: Arithmetic mean of the source FiberLab C particle descriptor.
  - name: C (lw)
    description: Length-weighted mean of the source FiberLab C particle descriptor.
  - name: C (llw)
    description: Length-length-weighted mean of the source FiberLab C particle descriptor.
  - name: F (arith)
    description: Arithmetic mean of the source FiberLab fibrillation descriptor F.
  - name: F (lw)
    description: Length-weighted mean of the source FiberLab fibrillation descriptor F.
  - name: F (llw)
    description: Length-length-weighted mean of the source FiberLab fibrillation descriptor F.
responses:
  - name: CSF
    description: Canadian Standard Freeness measurement.
  - name: Density
    description: Laboratory handsheet density measurement.
  - name: TI
    description: Laboratory handsheet tensile-index measurement.
  - name: Elongation
    description: Laboratory handsheet elongation-at-break measurement.
  - name: TEA
    description: Laboratory handsheet tensile-energy-absorption measurement.
  - name: TSI
    description: Laboratory handsheet tensile-stiffness-index measurement.
  - name: Tear index
    description: Laboratory handsheet tear-index measurement.
  - name: s
    description: Laboratory handsheet light-scattering coefficient.
sample_alignment:
  method: positional
  description: >-
    Row i in X.csv and row i in Y.csv refer to the same pulp sample. The source supplementary
    table stores all variables on one row, so selecting and splitting columns preserves alignment.
missing_values:
  predictors: none
  responses: none
source:
  type: publication-supplement
  publication:
    citation: >-
      Lindström, S. B., Ferritsius, R., Carlson, J. E., Persson, J., and Nilsson, F. (2025).
      Predicting handsheet properties and enhancing refiner control using fiber analyzer data and
      latent variable modeling. Computers & Chemical Engineering, 199, 109143.
    doi: 10.1016/j.compchemeng.2025.109143
    supplementary_material: >-
      MMC S1, spreadsheet containing refiner controls, specific refining energy, fiber properties,
      and pulp and handsheet properties.
  access_note: >-
    The publication DOI is the public provenance reference for the article and its supplementary
    material. The committed X.csv and Y.csv files are the complete analysis-facing assets needed
    for the repository example.
license:
  identifier: CC-BY-4.0
  file: LICENSE.txt
  redistribution: permitted with attribution
preparation:
  description: >-
    Select the named fiber-property variables Shives through F (llw) as predictors and the named
    variables CSF through s as responses from the publication supplementary table. Refiner
    controls, specific refining energy, and the final k variable are not part of the model
    matrices. Preserve all 46 rows, selected numeric values, column order, and row order. No values
    are imputed, centered, scaled, rounded, or otherwise transformed.
integrity:
  sha256:
    X.csv: b26d1639339c406bf91070e2ad8ceb8df59d3ad1f90ece7c5cd5b18264d63b45
    Y.csv: b600264d2319efce3500c6d7adbf5490b62e6d42a1e32af7df62709b1975ce93
    LICENSE.txt: e21d8674cbe4b64a371cd530a0ea8fa4727c1de7005dc707e86b55ea8e6f14d7
