[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipls"
version = "0.0.0"
description = "Pi-PLS multivariate regression"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Pi-PLS authors"}]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pandas>=2.0",
  "PyYAML>=6",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "threadpoolctl>=3.1",
]
benchmarks = ["PyYAML>=6", "threadpoolctl>=3.1"]
docs = []
data = ["pandas>=2.0", "scipy>=1.11", "openpyxl>=3.1", "PyYAML>=6"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::pipls.exceptions.StatisticalSupportWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["pipls"]
strict = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true
